[package]
name = "opensmith-cloud-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
opensmith-cloud = { version = "0.1.0", path = "../api" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
